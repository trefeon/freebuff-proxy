# Upstream drift detection (CodebuffAI/freebuff).
#
#  Wire drift is additionally classified by scripts/review-wire-drift.sh:
#  COMMENT-ONLY (docs) vs FUNCTIONAL (needs a Go-side port).
#  1. **Registry pin drift** (the 6 files in backend/internal/registry/testdata/upstream/):
#     auto-open a PR that runs sync-upstream so the change lands in front of a
#     human reviewer. Idempotent: reruns reuse the same branch + open PR.
#  2. **Wire-shape file drift** (freebuff-trust.ts, foreign-client-signals.ts,
#     prompt-agent-stream.ts, etc.): auto-open a "needs port" PR carrying the
#     refreshed wire baseline plus the classification report, so the Go-side
#     port lands on the PR branch in front of a human reviewer. Idempotent:
#     reruns reuse the same branch + open PR. Never auto-merge because the
#     port needs human judgment.
#  3. **Dashboard embed refresh**: a separate job always refreshes the JSON
#     embedded in the dashboard binary so users see up-to-date sync status
#     without a live network call at boot.
# NOTE: all three PR-opening jobs need Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".
name: upstream-drift

on:
  workflow_dispatch:
  schedule:
    # Every 12h (05:17 and 17:17 UTC): the upstream public-sync bot lands
    # batches near-daily. Each run diffs checkpoint -> HEAD, where the
    # checkpoint is the committed pin (snapshots.json upstream_sha), so the
    # report always covers last-recorded ver -> current ver with nothing
    # missed between runs. Close-superseded steps keep one rolling PR per SHA.
    - cron: '17 5,17 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Detect upstream drift
    runs-on: ubuntu-latest
    outputs:
      has_drift: ${{ steps.report.outputs.has_drift }}
      has_registry_drift: ${{ steps.report.outputs.has_registry_drift }}
      has_wire_drift: ${{ steps.report.outputs.has_wire_drift }}
      upstream_sha: ${{ steps.report.outputs.upstream_sha }}
      drift_summary: ${{ steps.report.outputs.drift_summary }}
      exact_action: ${{ steps.exact.outputs.exact_action }}
      exact_functional: ${{ steps.exact.outputs.exact_functional }}
      exact_announce: ${{ steps.exact.outputs.exact_announce }}
      tui_action: ${{ steps.tui.outputs.tui_action }}
      tui_announce: ${{ steps.tui.outputs.tui_announce }}
      tui_refresh: ${{ steps.tui.outputs.tui_refresh }}
      old_sha: ${{ steps.exact.outputs.old_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run drift detection
        id: report
        env:
          DRIFT_REPORT: ${{ runner.temp }}/drift.json
          FREEBUFF_REFERENCE_DIR: ${{ runner.temp }}/freebuff-ref
        run: |
          rc=0
          bash scripts/check-upstream.sh main 2>&1 | tee "$RUNNER_TEMP/check.log" || rc=$?
          echo "check-upstream.sh exit code: $rc"
          echo "script_rc=$rc" >>"$GITHUB_ENV"
          echo "drift.json:"
          cat "$DRIFT_REPORT"
          echo

          has_drift=$(jq -r 'any(.files[]; .status != "SAME")' "$DRIFT_REPORT")
          has_registry=$(jq -r 'any(.files[]; .group == "registry" and .status != "SAME")' "$DRIFT_REPORT")
          has_wire=$(jq -r 'any(.files[]; .group == "wire" and (.status == "MISSING_UPSTREAM" or .status == "DRIFT"))' "$DRIFT_REPORT")
          upstream_sha=$(jq -r '.upstream_sha' "$DRIFT_REPORT")

          {
            echo "has_drift=$has_drift"
            echo "has_registry_drift=$has_registry"
            echo "has_wire_drift=$has_wire"
            echo "upstream_sha=$upstream_sha"
          } >>"$GITHUB_OUTPUT"

          drift_summary=$(jq -r '
            ["upstream_sha: " + .upstream_sha,
             "checked_at:  " + .checked_at,
             "",
             "Drifted files:"] +
            ([.files[] | select(.status != "SAME") |
              "  - [" + .group + "] " + .file + " (" + .pinned_sha + " -> " + .vendor_sha + ") [" + .status + "]"])
            | join("\n")
          ' "$DRIFT_REPORT")
          {
            echo "drift_summary<<EOF"
            echo "$drift_summary"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - name: Run exact drift detection
        id: exact
        env:
          EXACT_REPORT: ${{ runner.temp }}/exact.json
          FREEBUFF_REFERENCE_DIR: ${{ runner.temp }}/freebuff-ref
        run: |
          # Export-level MODEL/PRICE/WIRE report, old pin -> new upstream SHA.
          # Exit 1 means action needed; never fail the job on it.
          rc=0
          bash scripts/drift-exact.sh "" "${{ steps.report.outputs.upstream_sha }}" || rc=$?
          echo "drift-exact.sh exit code: $rc"
          {
            echo "exact_action=$(jq -r .summary.action_needed "$EXACT_REPORT")"
            echo "exact_functional=$(jq -r .summary.functional_files "$EXACT_REPORT")"
            echo "old_sha=$(jq -r .old_sha "$EXACT_REPORT")"
          } >>"$GITHUB_OUTPUT"
          {
            echo "exact_announce<<EOF"
            jq -r '.announce[]' "$EXACT_REPORT"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Run TUI wireframe detection
        id: tui
        env:
          TUI_REPORT: ${{ runner.temp }}/tui.json
          FREEBUFF_REFERENCE_DIR: ${{ runner.temp }}/freebuff-ref
        run: |
          # Picker rows/order/fields, checkpoint pin -> new upstream SHA.
          # Exit 1 means action needed; never fail the job on it.
          rc=0
          bash scripts/drift-tui.sh "" "${{ steps.report.outputs.upstream_sha }}" || rc=$?
          echo "drift-tui.sh exit code: $rc"
          {
            echo "tui_action=$(jq -r .action_needed "$TUI_REPORT")"
          } >>"$GITHUB_OUTPUT"
          {
            echo "tui_announce<<EOF"
            jq -r '.announce[]' "$TUI_REPORT"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          {
            echo "tui_refresh<<EOF"
            jq -r '.refresh[]' "$TUI_REPORT"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"


      - name: Post step summary
        if: always()
        env:
          DRIFT_REPORT: ${{ runner.temp }}/drift.json
          EXACT_REPORT: ${{ runner.temp }}/exact.json
          TUI_REPORT: ${{ runner.temp }}/tui.json
          OLD_SHA: ${{ steps.exact.outputs.old_sha }}
          UPSTREAM_SHA: ${{ steps.report.outputs.upstream_sha }}
        run: |
          echo "## Upstream drift check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checkpoint ${OLD_SHA:0:7} -> upstream ${UPSTREAM_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "check-upstream.sh exit code: ${script_rc:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$DRIFT_REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Exact drift (scripts/drift-exact.sh)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$EXACT_REPORT" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.announce[]' "$EXACT_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exact report missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## TUI wireframe (scripts/drift-tui.sh)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$TUI_REPORT" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.announce[]' "$TUI_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.refresh[]' "$TUI_REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tui report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

  codegen-parity:
    name: Generated files match wiregen output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Regenerate from snapshots and diff
        run: |
          # The manifest SHA is the source of truth: cmd/wiregen refuses any
          # other -upstream value, so regen here always uses the committed
          # snapshots. A diff means someone edited a _gen file by hand or
          # re-pinned snapshots without regenerating.
          sha=$(jq -r .upstream_sha backend/internal/wirefacts/testdata/wire/snapshots.json)
          go run ./backend/cmd/wiregen -upstream "$sha"
          git diff --exit-code -- \
            backend/internal/wirefacts/wirefacts_gen.go \
            backend/internal/modelcat/catalog_gen.go \
            backend/internal/upstream/wirecodes_gen.go \
            backend/internal/upstream/notices_gen.go \
            backend/internal/convert/toolnames_gen.go \
          || { echo "::error::Generated files are stale - run 'go run ./backend/cmd/wiregen -upstream $sha' (or go generate ./...) and commit the result."; exit 1; }

  open-drift-pr:
    name: Open sync PR (registry drift)
    needs: drift
    if: needs.drift.outputs.has_registry_drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check out fresh branch
        env:
          BRANCH_NAME: chore/upstream-drift-${{ needs.drift.outputs.upstream_sha }}
        run: |
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            git checkout -B "$BRANCH_NAME" origin/"$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Run sync-upstream
        env:
          # sync-upstream reads the local clone, not a fresh one. The CI
          # clone is shallow (depth 50) which is enough for sync-upstream's
          # use. We unshallow first to avoid "fetch first" errors.
          FREEBUFF_REFERENCE_DIR: ${{ runner.temp }}/freebuff-ref
        run: |
          mkdir -p "$FREEBUFF_REFERENCE_DIR"
          git clone --depth 50 https://github.com/CodebuffAI/freebuff.git "$FREEBUFF_REFERENCE_DIR"
          git -C "$FREEBUFF_REFERENCE_DIR" fetch --unshallow || true
          bash scripts/sync-upstream.sh --test-all

      - name: Commit any changes
        run: |
          git add backend/internal/registry/testdata/upstream backend/internal/registry/registry.go || true
          if git diff --cached --quiet; then
            # No new changes this run. A branch that already carries the
            # sync commit (pushed by an earlier run whose PR creation
            # failed) must still reach the PR step; only a branch identical
            # to main means there is genuinely nothing to publish.
            if git diff --quiet origin/main HEAD; then
              echo "No changes after sync-upstream and branch matches main; skipping PR."
              exit 0
            fi
            echo "Branch already has sync commits ahead of main; reusing them."
          else
            sha="${{ needs.drift.outputs.upstream_sha }}"
            short="${sha:0:7}"
            git -c commit.gpgsign=false commit -m "chore(registry): sync pinned upstream models to vendor ${short}" \
              -m "Automated sync triggered by .github/workflows/upstream-drift.yml." \
              -m "Upstream SHA: ${sha}" \
              -m "Drift summary:" \
              -m "${{ needs.drift.outputs.drift_summary }}"
          fi
          git push -u origin HEAD

      - name: Close superseded sync PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
        run: |
          # One rolling sync PR per upstream SHA; an older open PR for a
          # different SHA is stale the moment a newer SHA exists.
          gh pr list --state open --json number,title,headRefName \
            --jq '.[] | select(.title | startswith("chore(registry): sync pinned upstream models to vendor")) | {number, title, branch: .headRefName}' \
          | jq -c . \
          | while read -r pr; do
              num=$(echo "$pr" | jq -r .number)
              branch=$(echo "$pr" | jq -r .branch)
              case "$branch" in
                chore/upstream-drift-"${UPSTREAM_SHA:0:7}"|chore/upstream-drift-"${UPSTREAM_SHA}") ;;
                *) gh pr close "$num" --comment "Superseded by upstream ${UPSTREAM_SHA:0:7}; a fresh sync PR covers the current pin state." \
                     && git push origin --delete "$branch" || true ;;
              esac
            done

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
          OLD_SHA: ${{ needs.drift.outputs.old_sha }}
          DRIFT_SUMMARY: ${{ needs.drift.outputs.drift_summary }}
          EXACT_ANNOUNCE: ${{ needs.drift.outputs.exact_announce }}
          TUI_ANNOUNCE: ${{ needs.drift.outputs.tui_announce }}
          TUI_REFRESH: ${{ needs.drift.outputs.tui_refresh }}
        run: |
          existing=$(gh pr list --state open --json number,title \
            --jq ".[] | select(.title | startswith(\"chore(registry): sync pinned upstream models to vendor ${UPSTREAM_SHA:0:7}\")) | .number" | head -1)
          if [ -n "$existing" ]; then
            echo "Existing sync PR #$existing already open for this upstream SHA; nothing to create."
            exit 0
          fi
          gh pr create --base main \
            --title "chore(registry): sync pinned upstream models to vendor ${UPSTREAM_SHA:0:7}" \
            --body "Checkpoint ${OLD_SHA:0:7} -> upstream ${UPSTREAM_SHA:0:7}

          $DRIFT_SUMMARY

          ## Backend impact (must change)
          - Registry pins (auto-synced in this PR) feed the wire prices map.
          - Regenerate the catalog: go run ./backend/cmd/wiregen -upstream $UPSTREAM_SHA.

          ## Exact model/price changes (scripts/drift-exact.sh)

          $EXACT_ANNOUNCE

          ## Frontend impact: picker rows/copy (scripts/drift-tui.sh)

          $TUI_ANNOUNCE

          Refresh: $TUI_REFRESH

          Note: PRs created with GITHUB_TOKEN do not trigger CI workflows; run the checks manually before merging." \
            --label "dependencies"

  open-port-pr:
    name: Open port PR (wire drift)
    needs: drift
    if: needs.drift.outputs.has_wire_drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone upstream reference
        env:
          FREEBUFF_REFERENCE_DIR: ${{ runner.temp }}/freebuff-ref
        run: |
          mkdir -p "$FREEBUFF_REFERENCE_DIR"
          git clone --depth 50 https://github.com/CodebuffAI/freebuff.git "$FREEBUFF_REFERENCE_DIR"
          git -C "$FREEBUFF_REFERENCE_DIR" fetch --unshallow || true

      - name: Classify wire drift
        id: classify
        env:
          FREEBUFF_REFERENCE_DIR: ${{ runner.temp }}/freebuff-ref
          FREEBUFF_REVIEW_END_REF: ${{ needs.drift.outputs.upstream_sha }}
        run: |
          out="$(bash scripts/review-wire-drift.sh || true)"
          {
          echo "classification<<EOF"
          echo "$out"
          echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Check out fresh branch
        env:
          BRANCH_NAME: chore/upstream-wire-${{ needs.drift.outputs.upstream_sha }}
        run: |
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            git checkout -B "$BRANCH_NAME" origin/"$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Refresh baseline and write drift report
        env:
          FREEBUFF_REFERENCE_DIR: ${{ runner.temp }}/freebuff-ref
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
        run: |
          bash scripts/check-upstream.sh --update-wire-baseline
          jq -n --arg sha "$UPSTREAM_SHA" --arg cls "$CLASSIFICATION" \
            '{upstream_sha: $sha, classification: $cls}' \
            > scripts/wire-drift-latest.json

      - name: Commit any changes
        run: |
          git add scripts/wire-baseline.tsv scripts/wire-drift-latest.json
          if git diff --cached --quiet; then
            # No new changes this run. A branch that already carries the
            # refresh commit (pushed by an earlier run whose PR creation
            # failed) must still reach the PR step; only a branch identical
            # to main means there is genuinely nothing to publish.
            if git diff --quiet origin/main HEAD; then
              echo "No changes after baseline refresh and branch matches main; skipping PR."
              exit 0
            fi
            echo "Branch already has refresh commits ahead of main; reusing them."
          else
            sha="${{ needs.drift.outputs.upstream_sha }}"
            short="${sha:0:7}"
            git -c commit.gpgsign=false commit -m "chore(wire): refresh baseline + drift report for vendor ${short}" \
              -m "Automated refresh triggered by .github/workflows/upstream-drift.yml." \
              -m "Upstream SHA: ${sha}"
          fi
          git push -u origin HEAD

      - name: Close superseded wire PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
        run: |
          # One rolling wire PR per upstream SHA; an older open PR for a
          # different SHA is stale the moment a newer SHA exists.
          gh pr list --state open --json number,title,headRefName \
            --jq '.[] | select(.title | startswith("chore(wire): upstream drift needs porting") or startswith("chore(wire): upstream drift to vendor")) | {number, title, branch: .headRefName}' \
          | jq -c . \
          | while read -r pr; do
              num=$(echo "$pr" | jq -r .number)
              branch=$(echo "$pr" | jq -r .branch)
              case "$branch" in
                chore/upstream-wire-"${UPSTREAM_SHA:0:7}"|chore/upstream-wire-"${UPSTREAM_SHA}") ;;
                *) gh pr close "$num" --comment "Superseded by upstream ${UPSTREAM_SHA:0:7}; a fresh wire-drift PR covers the current pin state." \
                     && git push origin --delete "$branch" || true ;;
              esac
            done

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
          OLD_SHA: ${{ needs.drift.outputs.old_sha }}
          DRIFT_SUMMARY: ${{ needs.drift.outputs.drift_summary }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          EXACT_FUNCTIONAL: ${{ needs.drift.outputs.exact_functional }}
          EXACT_ANNOUNCE: ${{ needs.drift.outputs.exact_announce }}
          TUI_ANNOUNCE: ${{ needs.drift.outputs.tui_announce }}
        run: |
          short="${UPSTREAM_SHA:0:7}"
          if [ "${EXACT_FUNCTIONAL:-0}" != "0" ]; then
            kind="[port-needed]"
          else
            kind="[comment-only]"
          fi
          title="chore(wire): upstream drift to vendor ${short} ${kind}"
          existing=$(gh pr list --state open --json number,title \
            --jq ".[] | select(.title | startswith(\"chore(wire): upstream drift to vendor ${short}\")) | .number" | head -1)
          if [ -n "$existing" ]; then
            echo "Existing wire-drift PR #$existing already open for this upstream SHA; nothing to create."
            exit 0
          fi
          body="Checkpoint ${OLD_SHA:0:7} -> upstream $UPSTREAM_SHA

          $DRIFT_SUMMARY

          ## Backend impact: port the FUNCTIONAL hunks below (Go-side + test)

          $EXACT_ANNOUNCE

          ## Frontend impact: picker rows/copy (scripts/drift-tui.sh)

          $TUI_ANNOUNCE

          ## Drift classification (scripts/review-wire-drift.sh)
          COMMENT-ONLY rows are resolved by the baseline refresh in this PR.
          Port the FUNCTIONAL rows here (Go-side port plus a test), then merge.
          Never auto-merge: the port needs human judgment.

          \`\`\`
          $CLASSIFICATION
          \`\`\`"
          gh pr create --base main \
            --title "$title" \
            --body "$body" \
            --label "anti-ban"

  publish-drift-data:
    name: Publish drift JSON to dashboard embed
    needs: drift
    # Always runs (even when no drift) so the embedded checked_at stays
    # current; the dashboard banner shows "last checked" even on clean runs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Close superseded drift-data PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
        run: |
          # Mirror of the registry job's close-superseded: one rolling PR per
          # upstream SHA; an older open PR for a different SHA is stale.
          gh pr list --state open --json number,title,headRefName \
            --jq '.[] | select(.title | startswith("chore(dashboard): refresh upstream-drift embed to vendor")) | {number, title, branch: .headRefName}' \
          | jq -c . \
          | while read -r pr; do
              num=$(echo "$pr" | jq -r .number)
              branch=$(echo "$pr" | jq -r .branch)
              case "$branch" in
                chore/upstream-drift-data-"${UPSTREAM_SHA:0:7}"|chore/upstream-drift-data-"${UPSTREAM_SHA}") ;;
                *) gh pr close "$num" --comment "Superseded by upstream ${UPSTREAM_SHA:0:7}; a fresh drift-data PR covers the current embed." \
                     && git push origin --delete "$branch" || true ;;
              esac
            done

      - name: Check out data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
        run: |
          # Switch branches BEFORE refreshing drift.json: the refresh dirties
          # the worktree, and switching after would abort on local changes.
          BRANCH="chore/upstream-drift-data-${UPSTREAM_SHA:0:7}"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            git checkout -B "$BRANCH" origin/"$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Refresh drift.json
        env:
          DRIFT_REPORT: backend/internal/dashboard/data/upstream_drift.json
        run: |
          # check-upstream writes the JSON report before exiting 1 on drift;
          # a drift report is exactly what the embed must publish.
          bash scripts/check-upstream.sh main || true
          head -20 backend/internal/dashboard/data/upstream_drift.json

      - name: Verify the embed still parses
        run: |
          go build ./backend/internal/dashboard/... ./backend/internal/server/...

      - name: Open or update drift-data PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.drift.outputs.upstream_sha }}
        run: |
          git add backend/internal/dashboard/data/upstream_drift.json
          if git diff --cached --quiet; then
            # Same orphan-branch recovery as the registry sync job: a branch
            # already carrying the refresh commit must still reach the PR step.
            if git diff --quiet origin/main HEAD; then
              echo "No data change and branch matches main; skipping PR."
              exit 0
            fi
            echo "Branch already has refresh commits ahead of main; reusing them."
          else
            short="${UPSTREAM_SHA:0:7}"
            git -c commit.gpgsign=false commit -m "chore(dashboard): refresh upstream-drift embed to vendor ${short}" \
              -m "Automated refresh by .github/workflows/upstream-drift.yml." \
              -m "Upstream SHA: ${UPSTREAM_SHA}"
          fi
          git push -u origin HEAD
          existing=$(gh pr list --state open --json number,title \
            --jq ".[] | select(.title | startswith(\"chore(dashboard): refresh upstream-drift embed to vendor ${short}\")) | .number" | head -1 || true)
          if [ -n "$existing" ]; then
            echo "Existing drift-data PR #$existing already open; skipping."
            exit 0
          fi
          gh pr create --base main \
            --title "chore(dashboard): refresh upstream-drift embed to vendor ${short}" \
            --body "Refreshes backend/internal/dashboard/data/upstream_drift.json against CodebuffAI/freebuff @ ${UPSTREAM_SHA}." \
            --label "dependencies"
