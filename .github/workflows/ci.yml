name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l backend)"

      - name: Build
        run: go build ./backend/...

      - name: Test (race detector)
        env:
          AUTH_TOKENS: ""
          ADMIN_TOKEN: ""
        run: go test -race -timeout 10m ./backend/...

      - name: Verify modules
        run: go mod verify

  # Reproduce the embedded dashboard bundle from source and fail when the
  # committed backend/internal/dashboard/dist is stale (the SPA is go:embed'd, so a
  # stale bundle sails silently into the binary).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run check
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run format:check
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run SPA e2e suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Verify committed dashboard bundle is fresh
        run: git diff --exit-code -- backend/internal/dashboard/dist
